<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCOLOGY</title>
<style>
  :root { --bg:#0b0d10; --fg:#d7dde3; --dim:#7b8794; --ok:#5fd38d; --warn:#f2c94c; --bad:#ef6b6b; --line:#1f252c; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 ui-monospace,Menlo,Consolas,monospace; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; letter-spacing:.3em; margin:0 0 4px }
  .sub { color:var(--dim); margin-bottom:16px }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:16px }
  .stat { border:1px solid var(--line); padding:8px; border-radius:4px }
  .stat b { display:block; font-size:18px }
  .stat small { color:var(--dim) }
  .ok { color:var(--ok) } .warn { color:var(--warn) } .bad { color:var(--bad) }
  .systems { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-bottom:16px }
  .sys { border:1px solid var(--line); padding:8px; border-radius:4px; display:flex; flex-direction:column; gap:4px }
  .sys .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden }
  .sys .bar i { display:block; height:100%; background:var(--ok) }
  .row2 { display:flex; gap:4px; flex-wrap:wrap } .row2 button { flex:1; padding:6px 4px; font-size:13px }
  button { background:#161b22; color:var(--fg); border:1px solid #2a323c; padding:8px 10px; border-radius:4px; cursor:pointer; font:inherit }
  button:hover { border-color:var(--fg) }
  button:disabled { opacity:.4; cursor:default }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center }
  #log { border-top:1px solid var(--line); padding-top:8px; max-height:40vh; overflow:auto; color:var(--dim) }
  #log p { margin:0 0 4px } #log p.ev { color:var(--warn) } #log p.week { color:var(--fg) }
  #over { display:none; border:1px solid var(--bad); padding:12px; margin-bottom:16px }
</style>
</head>
<body>
<main>
  <h1>ARCOLOGY</h1>
  <div class="sub" id="sub"></div>
  <div id="over"></div>
  <div class="grid" id="stats"></div>
  <div class="systems" id="systems"></div>
  <div class="row">
    <button id="rentDown">Rent -5%</button>
    <button id="rentUp">Rent +5%</button>
    <button id="wait">Hold (next week)</button>
    <button id="year">Hold a year</button>
    <button id="auto">Autoplay</button>
    <button id="reset">New seed</button>
  </div>
  <div id="log"></div>
</main>
<script>
// ARCOLOGY v1. A seeded, deterministic week-by-week simulation of one vast
// arcology on the Hudson, over a century. You are its operator. Keep it running.

// weeks: how long a project takes to come online once commissioned.
const SYSTEMS = {
  housing:  { name:'Residential decks', unit:'beds',   per:12000, cost:320, weeks:78,  upkeep:.30, desc:'Each deck houses 12,000 people. A year and a half to build.' },
  power:    { name:'Fusion & solar',    unit:'MW',     per:180,   cost:260, weeks:104, upkeep:.25, desc:'Everyone needs 12 kW. Farms and water need more. Two years.' },
  water:    { name:'Hudson desal',      unit:'ML/day', per:60,    cost:180, weeks:52,  upkeep:.15, desc:'Each resident drinks, washes and flushes 150 L a day. A year.' },
  food:     { name:'Vertical farms',    unit:'t/day',  per:120,   cost:210, weeks:26,  upkeep:.20, desc:'Half the food is grown in-tower. The rest comes through the Lincoln Tunnel. Six months.' },
  waste:    { name:'Reclamation',       unit:'t/day',  per:150,   cost:160, weeks:39,  upkeep:.12, desc:'Composts, recycles and pumps sludge to Newtown Creek. Nine months.' },
  clinics:  { name:'Clinics & schools', unit:'seats',  per:8000,  cost:230, weeks:30,  upkeep:.35, desc:'Health, childcare, schools. Morale sags without them. Seven months.' },
  commerce: { name:'Commercial floors', unit:'jobs',   per:9000,  cost:290, weeks:40,  upkeep:.15, desc:'Jobs and tax revenue. Needs residents to fill them. Ten months.' },
  transit:  { name:'Transit links',     unit:'riders', per:40000, cost:380, weeks:156, upkeep:.30, desc:'Skybridges, the 7 train spur, the ferry slip. Three years.' },
};
// Construction crews: a bigger arcology can carry more projects at once.
const crews = s => 3 + Math.floor(Object.values(s.levels).reduce((a,b)=>a+b,0)/8);
const busy = s => s.projects.filter(p=>!p.refit).length;   // refits are maintenance, not construction

// p is the chance of each event in a given week.
const EVENTS = [
  { p:.08, text:'Heat wave over the five boroughs. Cooling load spikes.', fx:s=>{s.mods.power=1.35} },
  { p:.04, text:'Con Edison grid fault. Your tower is on its own tonight.', fx:s=>{s.mods.power=1.6} },
  { p:.05, text:'Nor\'easter. Storm surge closes the ferry slip and the tunnel.', fx:s=>{s.mods.transit=.5; s.mods.food=1.3} },
  { p:.05, text:'Sanitation strike. Nothing leaves the building.', fx:s=>{s.mods.waste=1.5} },
  { p:.02, text:'City inspector finds code violations. Fine levied.', fx:s=>{s.money-=40; s.log('Paid $40M in fines.')} },
  { p:.05, text:'A tech firm leases three floors. Commerce booms.', fx:s=>{s.mods.commerce=1.4} },
  { p:.04, text:'Rent-strike meeting on deck 41. Morale wobbles.', fx:s=>{s.morale-=6} },
  { p:.03, text:'Fusion plant maintenance window. Output halved.', fx:s=>{s.mods.power=2} },
  { p:.05, text:'Housing lottery draws a crowd. Thousands apply.', fx:s=>{s.pop+=4000} },
  { p:.03, text:'Favorable write-up in the Times. The whole city is curious.', fx:s=>{s.morale+=5; s.pop+=2500} },
];

function rng(seed){ let a=seed>>>0; return ()=>{ a+=0x6D2B79F5; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }

function newState(seed){
  const s = {
    seed, rand:rng(seed), week:1, pop:60000, money:1500, morale:72, rent:1.0, over:null, net:null,
    levels:{housing:6, power:6, water:2, food:1, waste:2, clinics:2, commerce:2, transit:2},
    wear:{housing:0, power:0, water:0, food:0, waste:0, clinics:0, commerce:0, transit:0},
    projects:[], mods:{}, lines:[], log(t,c){ s.lines.unshift({t,c}); if(s.lines.length>200) s.lines.pop(); },
  };
  s.log('Week 1. The arcology opens on the Hudson at 34th Street. 60,000 residents move in.','week');
  return s;
}

const when = s => `Year ${Math.floor((s.week-1)/52)+1}, week ${(s.week-1)%52+1}`;
function cap(s,k){ return SYSTEMS[k].per*s.levels[k]*(1-s.wear[k])*(1/(s.mods[k]||1)); }
const WEAR = 0.0018;   // per week: about 9% of capacity a year, unless refitted
function refitCost(s,k){ return 0.25*buildCost(s,k); }
function refitting(s,k){ return s.projects.some(p=>p.k===k && p.refit); }
function buildCost(s,k){ return SYSTEMS[k].cost*(1+s.levels[k]*0.03); }
function inFlight(s,k){ return s.projects.filter(p=>p.k===k).length; }

// Demand each system faces, in that system's units.
function demand(s){
  return {
    housing:  s.pop,
    power:    s.pop*0.012 + s.levels.food*25 + s.levels.water*15,
    water:    s.pop*150/1e6,            // ML/day: 150 L each
    food:     s.pop*0.001,              // tonnes/day grown in-tower: half of 2 kg each
    waste:    s.pop*0.0025,
    clinics:  s.pop*0.12,
    commerce: s.pop*0.14,
    transit:  s.pop*0.6,
  };
}

function ratio(s,k){ const d=demand(s)[k]; return d===0?1:Math.min(1.5, cap(s,k)/d); }

function commission(s,k){
  const c = buildCost(s,k);
  if (busy(s)>=crews(s)) { s.log(`Every crew is busy. ${crews(s)} projects is the limit for now.`); return false; }
  if (s.money<c) { s.log(`Cannot afford ${SYSTEMS[k].name}.`); return false; }
  s.money-=c; s.projects.push({k, left:SYSTEMS[k].weeks});
  s.log(`Commissioned ${SYSTEMS[k].name} level ${s.levels[k]+inFlight(s,k)} for $${c.toFixed(0)}M. Opens in ${SYSTEMS[k].weeks} weeks.`);
  return true;
}

function refit(s,k){
  const c = refitCost(s,k);
  if (s.money<c) { s.log(`Cannot afford to refit ${SYSTEMS[k].name}.`); return false; }
  if (refitting(s,k)) return false;
  s.money-=c; s.projects.push({k, left:8, refit:true});
  s.log(`Refit of ${SYSTEMS[k].name} begins: $${c.toFixed(0)}M, eight weeks.`);
  return true;
}

function tick(s, action){
  s.mods = {};
  if (action && action.startsWith('refit:')) refit(s, action.slice(6));
  else if (action && SYSTEMS[action]) commission(s,action);
  for (const k in SYSTEMS) s.wear[k] = Math.min(0.9, s.wear[k]+WEAR);

  // Construction
  for (const p of s.projects) p.left--;
  for (const p of s.projects.filter(p=>p.left<=0)) { if (p.refit) { s.wear[p.k]=0; s.log(`${SYSTEMS[p.k].name} refit complete. Good as new.`); } else { s.levels[p.k]++; s.log(`${SYSTEMS[p.k].name} level ${s.levels[p.k]} opens.`); } }
  s.projects = s.projects.filter(p=>p.left>0);

  // Supply vs demand. Chronic shortfalls wear on people all week; an event
  // (a heat wave, a strike) is a bad day or two on top of that.
  const weight = {housing:14, power:12, water:12, food:6, waste:5, clinics:6, commerce:4, transit:5};
  const mood = () => { let dm=0; for (const k in SYSTEMS) { const r=ratio(s,k); if (r<1) dm -= weight[k]*(1-r); else dm += 0.1; } return dm; };
  const chronic = mood();
  for (const e of EVENTS) if (s.rand()<e.p) { s.log(e.text,'ev'); e.fx(s); }
  const acute = mood() - chronic;
  let dm = chronic*3 + acute;
  dm -= (s.rent-1)*10*3;    // expensive rent hurts
  dm += 0.8*3;              // baseline drift up when things work
  s.morale = Math.max(0, Math.min(100, s.morale + dm));

  // Population: morale draws people in or drives them out; the beds cap it.
  const want = (s.morale-50)/50 * 0.004 * s.pop / (1 + Math.pow(s.pop/2e6,2));   // the city only has so many people to give
  s.pop = Math.round(s.pop + want + (s.rand()-0.5)*0.003*s.pop);
  const beds = cap(s,'housing');
  if (s.pop>beds) { if (s.pop-beds>500) s.log(`${Math.round(s.pop-beds).toLocaleString()} people turned away at the lobby. No beds.`,'ev'); s.pop=Math.round(beds); }
  s.pop = Math.max(1000, s.pop);

  // Money, per week, in $M. Rent is $1,800/month, about $60 a day per resident.
  const occupancy = Math.min(1, s.pop/beds);
  const rentIncome = s.pop * 60 * s.rent * (0.6+0.4*occupancy) / 1e6;
  const jobs = Math.min(demand(s).commerce, cap(s,'commerce')) * (s.mods.commerce||1);
  const tax = jobs * 300 / 1e6;   // each job is worth $300 a day in leases and tax
  const net = 7*(rentIncome + tax - upkeepOf(s));
  s.money += net; s.net = net;

  s.week++;
  s.log(`${when(s)}. Pop ${s.pop.toLocaleString()}, morale ${Math.round(s.morale)}, net $${net.toFixed(1)}M.`,'week');

  if (s.morale<=5) s.over = 'The residents have left. The tower stands empty over the river.';
  if (s.money<-1000) s.over = 'The city has taken the arcology into receivership.';
  if (s.week>5200) s.over = 'A century. The arcology has outlived everyone who built it. New York goes on.';
  return s;
}
function upkeepOf(s){ let u=0; for (const k in SYSTEMS) u += SYSTEMS[k].upkeep*s.levels[k]; return u; }

// A simple operator for autoplay. It looks as far ahead as each project takes
// to build, commissions the system that will be shortest by then, and keeps a
// reserve so it is never caught by a bad winter.
function aiPick(s){
  if (s.morale>88 && s.rent<1.3) s.rent+=.05; else if (s.morale<65 && s.rent>.9) s.rent-=.05; else if (s.morale<45 && s.rent>.7) s.rent-=.05;
  let tired=null, tw=0.12;
  for (const k in SYSTEMS) if (s.wear[k]>tw && !refitting(s,k)) { tw=s.wear[k]; tired=k; }
  if (tired && s.money > refitCost(s,tired)) return 'refit:'+tired;
  if (busy(s)>=crews(s)) return null;
  let refitAll = 0; for (const k in SYSTEMS) refitAll += refitCost(s,k);
  const reserve = 6*7*upkeepOf(s) + refitAll;
  const d = demand(s), growth = Math.max(0, (s.morale-50)/50*0.004/(1+Math.pow(s.pop/2e6,2)));
  let pick=null, worst=1.15;
  for (const k in SYSTEMS) {
    const sy=SYSTEMS[k];
    const future = SYSTEMS[k].per*(s.levels[k]+inFlight(s,k)-s.projects.filter(p=>p.k===k&&p.refit).length)*(1-s.wear[k]) / (d[k]*Math.pow(1+growth, sy.weeks));
    if (future<worst) { worst=future; pick=k; }
  }
  if (!pick) return null;
  const losing = s.net!=null && s.net<0;
  if ((losing && worst>0.9) || s.money < buildCost(s,pick)+reserve) return null;
  return pick;
}

// UI
let S, autoTimer=null;
const $ = id=>document.getElementById(id);
function cls(r){ return r>=1?'ok':r>=.8?'warn':'bad'; }
function render(){
  $('sub').textContent = `Seed ${S.seed} · Year ${Math.floor((S.week-1)/52)+1} of 100 · Week ${(S.week-1)%52+1} · Hudson Yards, New York`;
  const d = demand(S);
  $('stats').innerHTML = [
    ['Residents', S.pop.toLocaleString(), ''],
    ['Treasury', `$${(S.money/1000).toFixed(2)}B`, S.money<0?'bad':''],
    ['Morale', Math.round(S.morale), cls(S.morale/60)],
    ['Rent', `$${Math.round(S.rent*1800)}/mo`, ''],
    ['Last week', S.net==null?'—':`${S.net>=0?'+':''}$${S.net.toFixed(1)}M`, S.net<0?'bad':'ok'],
    ['Crews', `${busy(S)} / ${crews(S)} busy`, busy(S)>=crews(S)?'warn':''],
  ].map(([n,v,c])=>`<div class="stat"><small>${n}</small><b class="${c}">${v}</b></div>`).join('');
  $('systems').innerHTML = Object.keys(SYSTEMS).map(k=>{
    const sy=SYSTEMS[k], r=ratio(S,k), c=cap(S,k), cost=buildCost(S,k);
    const building = S.projects.filter(p=>p.k===k).map(p=>`${p.refit?'refit ':''}${p.left} wk`).join(', ');
    const wear = Math.round(S.wear[k]*100), rc = refitCost(S,k);
    return `<div class="sys"><div><b>${sy.name}</b> <span class="${cls(r)}">L${S.levels[k]}</span>${building?` <small class="warn">building: ${building}</small>`:''}</div>
      <div class="bar"><i style="width:${Math.min(100,r*100/1.5)}%;background:var(--${cls(r)})"></i></div>
      <small>${Math.round(c).toLocaleString()} / ${Math.round(d[k]).toLocaleString()} ${sy.unit}</small>
      <small style="color:var(--dim)">${sy.desc}</small>
      <small>Wear <span class="${wear>30?'bad':wear>15?'warn':''}">${wear}%</span></small>
      <div class="row2"><button data-k="${k}" ${S.over||S.money<cost||busy(S)>=crews(S)?'disabled':''}>Build · $${cost.toFixed(0)}M · ${sy.weeks} wk</button>
      <button data-r="${k}" ${S.over||S.money<rc||refitting(S,k)?'disabled':''}>Refit · $${rc.toFixed(0)}M · 8 wk</button></div></div>`;
  }).join('');
  $('log').innerHTML = S.lines.map(l=>`<p class="${l.c||''}">${l.t}</p>`).join('');
  $('over').style.display = S.over?'block':'none'; $('over').textContent = S.over||'';
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>step(b.dataset.k));
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>step('refit:'+b.dataset.r));
}
function step(a){ if (S.over) return; tick(S,a); render(); }
function start(seed){ clearInterval(autoTimer); autoTimer=null; $('auto').textContent='Autoplay'; S=newState(seed); location.hash=seed; render(); }
$('wait').onclick=()=>step(null);
$('year').onclick=()=>{ for (let i=0;i<52&&!S.over;i++) tick(S,null); render(); };
$('rentUp').onclick=()=>{S.rent=Math.min(2,S.rent+.05); S.log(`Rent raised to $${Math.round(S.rent*1800)}/mo.`); render();};
$('rentDown').onclick=()=>{S.rent=Math.max(.5,S.rent-.05); S.log(`Rent cut to $${Math.round(S.rent*1800)}/mo.`); render();};
$('reset').onclick=()=>start((Math.random()*1e9)|0);
$('auto').onclick=()=>{ if (autoTimer){ clearInterval(autoTimer); autoTimer=null; $('auto').textContent='Autoplay'; return; }
  $('auto').textContent='Stop'; autoTimer=setInterval(()=>{ if (S.over){ clearInterval(autoTimer); autoTimer=null; $('auto').textContent='Autoplay'; return; } step(aiPick(S)); },30); };
start(parseInt(location.hash.slice(1))||20261021);
</script>
</body>
</html>
