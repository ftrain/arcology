<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCOLOGY</title>
<style>
  :root { --bg:#0b0d10; --fg:#d7dde3; --dim:#7b8794; --ok:#5fd38d; --warn:#f2c94c; --bad:#ef6b6b; --line:#1f252c; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 ui-monospace,Menlo,Consolas,monospace; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; letter-spacing:.3em; margin:0 0 4px }
  .sub { color:var(--dim); margin-bottom:16px }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:16px }
  .stat { border:1px solid var(--line); padding:8px; border-radius:4px }
  .stat b { display:block; font-size:18px }
  .stat small { color:var(--dim) }
  .ok { color:var(--ok) } .warn { color:var(--warn) } .bad { color:var(--bad) }
  .systems { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin-bottom:16px }
  .sys { border:1px solid var(--line); padding:8px; border-radius:4px; display:flex; flex-direction:column; gap:4px }
  .sys .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden }
  .sys .bar i { display:block; height:100%; background:var(--ok) }
  button { background:#161b22; color:var(--fg); border:1px solid #2a323c; padding:8px 10px; border-radius:4px; cursor:pointer; font:inherit }
  button:hover { border-color:var(--fg) }
  button:disabled { opacity:.4; cursor:default }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center }
  #log { border-top:1px solid var(--line); padding-top:8px; max-height:40vh; overflow:auto; color:var(--dim) }
  #log p { margin:0 0 4px } #log p.ev { color:var(--warn) } #log p.day { color:var(--fg) }
  #over { display:none; border:1px solid var(--bad); padding:12px; margin-bottom:16px }
</style>
</head>
<body>
<main>
  <h1>ARCOLOGY</h1>
  <div class="sub" id="sub"></div>
  <div id="over"></div>
  <div class="grid" id="stats"></div>
  <div class="systems" id="systems"></div>
  <div class="row">
    <button id="rentDown">Rent -5%</button>
    <button id="rentUp">Rent +5%</button>
    <button id="wait">Hold (next day)</button>
    <button id="auto">Autoplay</button>
    <button id="reset">New seed</button>
  </div>
  <div id="log"></div>
</main>
<script>
// ARCOLOGY v1. A seeded, deterministic day-by-day simulation of one vast
// arcology on the Hudson. You are its operator. Keep it running.

const SYSTEMS = {
  housing:  { name:'Residential decks', unit:'beds',   per:12000, cost:320,  upkeep:.30, desc:'Each deck houses 12,000 people.' },
  power:    { name:'Fusion & solar',    unit:'MW',     per:180,   cost:260,  upkeep:.25, desc:'Everyone needs 12 kW. Farms and water need more.' },
  water:    { name:'Hudson desal',      unit:'ML/day', per:60,    cost:180,  upkeep:.15, desc:'Each resident drinks, washes and flushes 150 L a day.' },
  food:     { name:'Vertical farms',    unit:'t/day',  per:120,   cost:210,  upkeep:.20, desc:'Half the food is grown in-tower. The rest is trucked in through the Lincoln Tunnel.' },
  waste:    { name:'Reclamation',       unit:'t/day',  per:150,   cost:160,  upkeep:.12, desc:'Composts, recycles and pumps sludge to Newtown Creek.' },
  clinics:  { name:'Clinics & schools', unit:'seats',  per:8000,  cost:230,  upkeep:.35, desc:'Health, childcare, schools. Morale sags without them.' },
  commerce: { name:'Commercial floors', unit:'jobs',   per:9000,  cost:290,  upkeep:.15, desc:'Jobs and tax revenue. Needs residents to fill them.' },
  transit:  { name:'Transit links',     unit:'riders', per:40000, cost:380, upkeep:.30, desc:'Skybridges, the 7 train spur, the ferry slip. Lets people and goods move.' },
};

const EVENTS = [
  { p:.06, text:'Heat wave over the five boroughs. Cooling load spikes.', fx:s=>{s.mods.power=1.35} },
  { p:.04, text:'Con Edison grid fault. Your tower is on its own tonight.', fx:s=>{s.mods.power=1.6} },
  { p:.05, text:'Nor\'easter. Storm surge closes the ferry slip and the tunnel.', fx:s=>{s.mods.transit=.5; s.mods.food=1.3} },
  { p:.05, text:'Sanitation strike. Nothing leaves the building.', fx:s=>{s.mods.waste=1.5} },
  { p:.015, text:'City inspector finds code violations. Fine levied.', fx:s=>{s.money-=40; s.log('Paid $40M in fines.')} },
  { p:.05, text:'A tech firm leases three floors. Commerce booms.', fx:s=>{s.mods.commerce=1.4} },
  { p:.04, text:'Rent-strike meeting on deck 41. Morale wobbles.', fx:s=>{s.morale-=6} },
  { p:.03, text:'Fusion plant maintenance window. Output halved.', fx:s=>{s.mods.power=2} },
  { p:.05, text:'Housing lottery draws a crowd. Thousands apply.', fx:s=>{s.pop+=4000} },
  { p:.03, text:'Favorable write-up in the Times. The whole city is curious.', fx:s=>{s.morale+=5; s.pop+=2500} },
];

function rng(seed){ let a=seed>>>0; return ()=>{ a+=0x6D2B79F5; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }

function newState(seed){
  const s = {
    seed, rand:rng(seed), day:1, pop:60000, money:1500, morale:70, rent:1.0, over:null,
    levels:{housing:6, power:5, water:2, food:1, waste:1, clinics:2, commerce:2, transit:1},
    mods:{}, lines:[], log(t,c){ s.lines.unshift({t,c}); if(s.lines.length>200) s.lines.pop(); },
  };
  s.log('Day 1. The arcology opens on the Hudson at 34th Street. 60,000 residents move in.','day');
  return s;
}

function cap(s,k){ return SYSTEMS[k].per*s.levels[k]*(1/(s.mods[k]||1)); }

// Demand each system faces, in that system's units.
function demand(s){
  return {
    housing:  s.pop,
    power:    s.pop*0.012 + s.levels.food*25 + s.levels.water*15,
    water:    s.pop*150/1e6,            // ML/day: 150 L each
    food:     s.pop*0.001,              // tonnes/day grown in-tower: half of 2 kg each
    waste:    s.pop*0.0025,
    clinics:  s.pop*0.12,
    commerce: s.pop*0.14,
    transit:  s.pop*0.6,
  };
}

function ratio(s,k){ const d=demand(s)[k]; return d===0?1:Math.min(1.5, cap(s,k)/d); }

function tick(s, action){
  s.mods = {};
  // Build
  if (action && SYSTEMS[action]) {
    const c = SYSTEMS[action].cost*(1+s.levels[action]*0.05);
    if (s.money>=c) { s.money-=c; s.levels[action]++; s.log(`Built ${SYSTEMS[action].name} level ${s.levels[action]} for $${(c/1000).toFixed(1)}M.`); }
    else s.log(`Cannot afford ${SYSTEMS[action].name}.`);
  }
  // Events
  for (const e of EVENTS) if (s.rand()<e.p) { s.log(e.text,'ev'); e.fx(s); }

  // Supply vs demand
  const r = {}; for (const k in SYSTEMS) r[k]=ratio(s,k);
  let dm = 0;
  const weight = {housing:14, power:12, water:12, food:6, waste:5, clinics:6, commerce:4, transit:5};
  for (const k in r) { if (r[k]<1) dm -= weight[k]*(1-r[k]); else dm += 0.1; }
  dm -= (s.rent-1)*10;      // expensive rent hurts
  dm += 0.8;                // baseline drift up when things work
  s.morale = Math.max(0, Math.min(100, s.morale + dm));

  // Population: morale drives it; housing caps it hard
  const want = (s.morale-50)/50 * 0.004 * s.pop;
  s.pop = Math.round(s.pop + want + (s.rand()-0.5)*400);
  const beds = cap(s,'housing');
  if (s.pop>beds) { s.log(`${Math.round(s.pop-beds).toLocaleString()} people turned away at the lobby. No beds.`,'ev'); s.pop=Math.round(beds); }
  s.pop = Math.max(1000, s.pop);

  // Money. Rent per resident per day (in $k): $1,800/month baseline.
  const occupancy = Math.min(1, s.pop/beds);
  // All money is in $M. Rent is $1,800/month, about $60 a day per resident.
  const rentIncome = s.pop * 60 * s.rent * (0.6+0.4*occupancy) / 1e6;
  const jobs = Math.min(demand(s).commerce, cap(s,'commerce')) * (s.mods.commerce||1);
  const tax = jobs * 300 / 1e6;   // each job is worth $300 a day in leases and tax
  let upkeep = 0; for (const k in SYSTEMS) upkeep += SYSTEMS[k].upkeep*s.levels[k];
  const net = rentIncome + tax - upkeep;
  s.money += net; s.net = net;

  s.day++;
  s.log(`Day ${s.day}. Pop ${s.pop.toLocaleString()}, morale ${Math.round(s.morale)}, net $${net.toFixed(1)}M.`,'day');

  if (s.morale<=5) s.over = 'The residents have left. The tower stands empty over the river.';
  if (s.money<-1000) s.over = 'The city has taken the arcology into receivership.';
  if (s.day>365) s.over = 'A year. The arcology is a part of New York now.';
  return s;
}

// A simple operator for autoplay: fix the worst shortfall it can afford.
function aiPick(s){
  if (s.morale>85 && s.rent<1.5) s.rent+=.05; else if (s.morale<40 && s.rent>.7) s.rent-=.05;
  let worst=null, wr=1.1;
  for (const k in SYSTEMS) { const r=ratio(s,k); if (r<wr) { wr=r; worst=k; } }
  let upkeep = 0; for (const k in SYSTEMS) upkeep += SYSTEMS[k].upkeep*s.levels[k];
  const reserve = 45*upkeep;   // six weeks of running costs
  const losing = s.net!=null && s.net<0;
  if (worst && (!losing || wr<0.9) && s.money > SYSTEMS[worst].cost*(1+s.levels[worst]*0.05)+reserve) return worst;
  if (!losing && s.money > 1200+reserve && ratio(s,'housing')<1.25) return 'housing';
  return null;
}

// UI
let S, autoTimer=null;
const $ = id=>document.getElementById(id);
function cls(r){ return r>=1?'ok':r>=.8?'warn':'bad'; }
function render(){
  $('sub').textContent = `Seed ${S.seed} · Day ${S.day} · Hudson Yards, New York`;
  const d = demand(S);
  $('stats').innerHTML = [
    ['Residents', S.pop.toLocaleString(), ''],
    ['Treasury', `$${(S.money/1000).toFixed(1)}B`, S.money<0?'bad':''],
    ['Morale', Math.round(S.morale), cls(S.morale/60)],
    ['Rent', `${Math.round(S.rent*1800)}/mo`, ''],
    ['Yesterday', S.net==null?'—':`${S.net>=0?'+':''}$${S.net.toFixed(1)}M`, S.net<0?'bad':'ok'],
  ].map(([n,v,c])=>`<div class="stat"><small>${n}</small><b class="${c}">${v}</b></div>`).join('');
  $('systems').innerHTML = Object.keys(SYSTEMS).map(k=>{
    const sy=SYSTEMS[k], r=ratio(S,k), c=cap(S,k), cost=sy.cost*(1+S.levels[k]*0.05);
    return `<div class="sys"><div><b>${sy.name}</b> <span class="${cls(r)}">L${S.levels[k]}</span></div>
      <div class="bar"><i style="width:${Math.min(100,r*100/1.5)}%;background:var(--${cls(r)})"></i></div>
      <small>${Math.round(c).toLocaleString()} / ${Math.round(d[k]).toLocaleString()} ${sy.unit}</small>
      <small style="color:var(--dim)">${sy.desc}</small>
      <button data-k="${k}" ${S.over||S.money<cost?'disabled':''}>Build · $${(cost/1000).toFixed(1)}M</button></div>`;
  }).join('');
  $('log').innerHTML = S.lines.map(l=>`<p class="${l.c||''}">${l.t}</p>`).join('');
  $('over').style.display = S.over?'block':'none'; $('over').textContent = S.over||'';
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>step(b.dataset.k));
}
function step(a){ if (S.over) return; tick(S,a); render(); }
function start(seed){ clearInterval(autoTimer); autoTimer=null; $('auto').textContent='Autoplay'; S=newState(seed); location.hash=seed; S.net=null; render(); }
$('wait').onclick=()=>step(null);
$('rentUp').onclick=()=>{S.rent=Math.min(2,S.rent+.05); S.log(`Rent raised to $${Math.round(S.rent*1800)}/mo.`); render();};
$('rentDown').onclick=()=>{S.rent=Math.max(.5,S.rent-.05); S.log(`Rent cut to $${Math.round(S.rent*1800)}/mo.`); render();};
$('reset').onclick=()=>start((Math.random()*1e9)|0);
$('auto').onclick=()=>{ if (autoTimer){ clearInterval(autoTimer); autoTimer=null; $('auto').textContent='Autoplay'; return; }
  $('auto').textContent='Stop'; autoTimer=setInterval(()=>{ if (S.over){ clearInterval(autoTimer); autoTimer=null; $('auto').textContent='Autoplay'; return; } step(aiPick(S)); },120); };
start(parseInt(location.hash.slice(1))||20261021);
if (typeof module!=='undefined') module.exports={newState,tick,aiPick,ratio};
</script>
</body>
</html>
